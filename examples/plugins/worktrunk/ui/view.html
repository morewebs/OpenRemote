<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 13px/1.45 var(--font-sans, system-ui, sans-serif); color: var(--text-1); background: var(--bg-app); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 { font-size: 12px; margin: 18px 0 8px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--text-3); }
  .small { font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius, 8px); padding: 10px 12px; margin: 8px 0; background: var(--bg-side); }
  .warn { border-color: var(--accent); }
  button { font: inherit; color: var(--text-1); background: var(--bg-hover); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: var(--bg-active); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.danger { color: #e5484d; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text-1); background: var(--bg-app); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-2); }
  .wt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .wt:first-child { border-top: 0; }
  .branch { font-weight: 600; }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--bg-hover); color: var(--text-2); margin-left: 4px; }
  .chip.on { background: var(--accent); color: #fff; }
  .actions { display: flex; gap: 6px; align-items: start; }
  .log { white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .hidden { display: none; }
  .err { color: #e5484d; white-space: pre-wrap; }
</style>
</head>
<body>
  <div class="row">
    <h1 class="grow">Worktrees</h1>
    <button id="refresh" title="Read the worktrees again">Refresh</button>
  </div>

  <div id="worktrunk" class="card small"></div>

  <h2>Repository</h2>
  <div class="row">
    <select id="repo" class="grow"></select>
    <button id="forget" title="Take this repository off the list">Forget</button>
  </div>
  <div class="row" style="margin-top:6px">
    <input id="add-path" class="grow mono" placeholder="Add a repository: its full path">
    <button id="add">Add</button>
  </div>
  <p class="muted small">Repositories appear here once an agent uses Worktrunk in them, or when you add one.</p>

  <div id="approvals" class="card warn hidden"></div>

  <h2>New worktree</h2>
  <div class="card">
    <div class="row">
      <label class="grow">Branch<input id="new-branch" class="mono" placeholder="feature-name"></label>
      <label>From<input id="new-base" class="mono" placeholder="default branch"></label>
    </div>
    <label style="margin-top:8px"><span><input type="checkbox" id="new-chat" checked> Start a chat there</span></label>
    <div id="chat-fields">
      <label style="margin-top:6px">First message<textarea id="new-prompt" placeholder="What the new chat should do"></textarea></label>
      <div class="row" style="margin-top:6px">
        <label>Harness<input id="new-harness" class="mono" placeholder="claude"></label>
        <label>Model<input id="new-model" class="mono" placeholder="the harness's default"></label>
      </div>
    </div>
    <div class="row" style="margin-top:8px"><button id="create" class="primary">Create</button></div>
  </div>

  <h2>Worktrees <span id="count" class="muted"></span></h2>
  <label class="small"><span><input type="checkbox" id="branches"> Also show branches without a worktree</span></label>
  <div id="list" class="card"></div>

  <div id="job" class="card hidden">
    <div class="row"><strong id="job-title" class="grow"></strong><span id="job-state" class="muted small"></span></div>
    <div id="job-log" class="log mono muted"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id)
const ask = (name, params = {}) => openremote.program.request(name, params)
let state = null
let harness = 'claude'
let watching = null
let autoChecked = false

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v)
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? '' : v)
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c instanceof Node ? c : String(c))
  return node
}

function currentRepo() {
  return $('repo').value || null
}

// A button that asks once more before it acts: frames have no confirm().
function sure(label, words, act, cls = '') {
  const b = el('button', { class: cls }, label)
  let armed = null
  b.addEventListener('click', () => {
    if (armed) {
      clearTimeout(armed)
      armed = null
      b.textContent = label
      act()
    } else {
      b.textContent = words
      armed = setTimeout(() => {
        armed = null
        b.textContent = label
      }, 4000)
    }
  })
  return b
}

function showWorktrunk(v) {
  const box = $('worktrunk')
  box.replaceChildren()
  if (!v) return
  if (!v.installed) {
    box.append(
      el('div', {}, el('strong', {}, 'Worktrunk is not installed'), ' — or OpenRemote can’t find it.'),
      el('div', { class: 'muted' }, v.error || ''),
    )
    const row = el('div', { class: 'row', style: 'margin-top:8px' })
    if (v.can_install_own_copy) {
      row.append(el('button', { class: 'primary', onclick: () => work('install', {}, 'Installing Worktrunk') }, `Install Worktrunk${v.latest ? ' ' + v.latest : ''}`))
    }
    row.append(el('button', { onclick: () => openremote.ui.openSettings() }, 'Set its path'))
    box.append(row)
    if (v.install_commands?.length) {
      box.append(el('div', { class: 'muted', style: 'margin-top:6px' }, 'Or install it yourself: ', ...v.install_commands.map((c, i) => [i ? ' · ' : '', el('span', { class: 'mono' }, c)])))
    }
    return
  }
  const top = el('div', { class: 'row' },
    el('span', { class: 'grow' }, el('strong', {}, `Worktrunk ${v.version ?? ''}`), el('span', { class: 'muted' }, ` · installed by ${v.method}`)),
    el('button', { onclick: checkUpdate }, 'Check for updates'),
  )
  box.append(top, el('div', { class: 'muted mono' }, v.path))
  if (v.update_available) {
    const row = el('div', { class: 'row', style: 'margin-top:8px' }, el('span', { class: 'grow' }, `Worktrunk ${v.latest} is out.`))
    if (v.can_update_here) row.append(el('button', { class: 'primary', onclick: () => work('update', {}, `Updating Worktrunk to ${v.latest}`) }, `Update to ${v.latest}`))
    else row.append(el('span', { class: 'mono' }, v.update_command))
    box.append(row)
  } else if (v.latest) {
    box.append(el('div', { class: 'muted' }, `Up to date (newest release ${v.latest}).`))
  } else if (v.check_error && v.check_error !== 'not checked yet') {
    box.append(el('div', { class: 'muted' }, `Couldn’t look up the newest release: ${v.check_error}`))
  }
}

function showRepos(s) {
  const sel = $('repo')
  const chosen = s.repo
  sel.replaceChildren(...(s.repos ?? []).map((r) => el('option', { value: r, selected: r === chosen }, r)))
  if (!s.repos?.length) sel.append(el('option', { value: '' }, 'No repositories yet'))
}

function showApprovals(a) {
  const box = $('approvals')
  const waiting = (a?.commands ?? []).filter((c) => !c.approved)
  box.classList.toggle('hidden', !waiting.length)
  if (!waiting.length) return
  box.replaceChildren(
    el('strong', {}, 'This repository’s hooks wait for your approval'),
    el('p', { class: 'small muted' }, 'Worktrunk runs these commands when worktrees are created, merged or removed. Until you approve them, creating or merging here stops with a note.'),
    ...waiting.map((c) => el('div', { class: 'mono small' }, el('span', { class: 'chip' }, c.phase), ' ', c.template)),
    el('div', { class: 'row', style: 'margin-top:8px' }, sure('Approve these commands', 'Run them in this repository? Click again', () => work('approve_hooks', { repo: currentRepo() }, 'Approving hooks'), 'primary')),
  )
}

function facts(item) {
  const out = []
  const ch = item.worktree?.changes
  if (ch) {
    const dirty = ['staged', 'modified', 'untracked', 'deleted', 'conflicted'].filter((k) => ch[k])
    if (dirty.length) out.push(dirty.join(', '))
  }
  const d = item.default_branch
  if (d && (d.ahead || d.behind)) out.push(`↑${d.ahead ?? 0} ↓${d.behind ?? 0}`)
  if (item.display?.state && !['is_main'].includes(item.display.state)) out.push(item.display.state.replace(/_/g, ' '))
  return out
}

function showList(s) {
  const box = $('list')
  box.replaceChildren()
  if (s.list_error) {
    box.append(el('div', { class: 'err' }, s.list_error))
    return
  }
  const items = s.list?.items ?? []
  $('count').textContent = items.length ? `(${items.length})` : ''
  if (!items.length) {
    box.append(el('div', { class: 'muted' }, s.repo ? 'Nothing listed.' : 'Pick or add a repository.'))
    return
  }
  for (const item of items) {
    const wt = item.worktree
    const main = wt?.main
    const actions = el('div', { class: 'actions' })
    if (item.branch) {
      actions.append(el('button', { title: 'Start a chat in this worktree', onclick: () => newChatIn(item.branch, !wt) }, 'New chat'))
      if (!main && wt) {
        actions.append(sure('Merge', `Merge into ${s.list?.default_branch ?? 'main'}?`, () => work('merge', { repo: wt.path, branch: item.branch }, `Merging ${item.branch}`)))
        actions.append(sure('Remove', 'Remove it?', () => work('remove', { repo: currentRepo(), branches: [item.branch] }, `Removing ${item.branch}`), 'danger'))
      }
    }
    box.append(el('div', { class: 'wt' },
      el('div', {},
        el('span', { class: 'branch' }, item.branch ?? '(detached)'),
        main ? el('span', { class: 'chip' }, 'main') : null,
        wt?.current ? el('span', { class: 'chip on' }, 'here') : null,
        !wt ? el('span', { class: 'chip' }, 'no worktree') : null,
        ...facts(item).map((f) => el('span', { class: 'chip' }, f)),
        wt ? el('div', { class: 'mono muted' }, wt.path) : null,
        item.head?.subject ? el('div', { class: 'small muted' }, item.head.subject) : null,
      ),
      actions,
    ))
  }
}

function newChatIn(branch, create) {
  $('new-branch').value = branch
  $('new-base').value = ''
  $('new-chat').checked = true
  $('chat-fields').classList.remove('hidden')
  $('create').dataset.create = create ? '1' : '0'
  $('create').textContent = 'Start the chat'
  $('new-prompt').focus()
}

async function load() {
  try {
    state = await ask('state', { repo: currentRepo(), branches: $('branches').checked })
  } catch (e) {
    $('worktrunk').replaceChildren(el('div', { class: 'err' }, String(e.message ?? e)))
    return
  }
  showWorktrunk(state.version)
  showRepos(state)
  showApprovals(state.approvals)
  showList(state)
  if (state.job?.running) watch()
  // Look for a new Worktrunk when the last look is a few hours old (the
  // program keeps the answer, and skips it when update checks are off).
  const v = state.version
  const stale = !v?.checked_at || Date.now() / 1000 - v.checked_at > 6 * 3600
  if (stale && !autoChecked) {
    autoChecked = true
    ask('check_update', { auto: true }).then(showWorktrunk).catch(() => {})
  }
}

async function checkUpdate() {
  try {
    const v = await ask('check_update')
    showWorktrunk(v)
    if (v.update_available) openremote.ui.toast(`Worktrunk ${v.latest} is out`)
  } catch (e) {
    openremote.ui.toast(String(e.message ?? e))
  }
}

async function work(name, params, title) {
  const started = await ask(name, params).catch((e) => ({ error: String(e.message ?? e) }))
  if (started.error) {
    openremote.ui.toast(started.error)
    return
  }
  $('job-title').textContent = title
  watch()
}

function watch() {
  if (watching) return
  $('job').classList.remove('hidden')
  watching = setInterval(async () => {
    const job = await ask('job').catch(() => null)
    if (!job) return
    $('job-log').textContent = (job.log ?? []).join('\n')
    $('job-state').textContent = job.running ? 'working…' : job.ok ? 'done' : 'failed'
    if (!job.running) {
      clearInterval(watching)
      watching = null
      if (job.ok && job.kind === 'start_chat') openremote.ui.toast('Started a chat in the new worktree')
      load()
    }
  }, 700)
}

$('refresh').addEventListener('click', load)
$('repo').addEventListener('change', load)
$('branches').addEventListener('change', load)
$('new-chat').addEventListener('change', () => $('chat-fields').classList.toggle('hidden', !$('new-chat').checked))
$('add').addEventListener('click', async () => {
  const path = $('add-path').value.trim()
  if (!path) return
  try {
    const added = await ask('add_repo', { path })
    $('add-path').value = ''
    state = await ask('state', { repo: added.repo })
    showWorktrunk(state.version)
    showRepos(state)
    showApprovals(state.approvals)
    showList(state)
  } catch (e) {
    openremote.ui.toast(String(e.message ?? e))
  }
})
$('forget').addEventListener('click', async () => {
  const repo = currentRepo()
  if (!repo) return
  await ask('forget_repo', { path: repo }).catch(() => {})
  $('repo').value = ''
  load()
})
$('create').addEventListener('click', () => {
  const branch = $('new-branch').value.trim()
  if (!branch) {
    $('new-branch').focus()
    return
  }
  const repo = currentRepo()
  const base = $('new-base').value.trim() || undefined
  const create = $('create').dataset.create !== '0'
  $('create').dataset.create = '1'
  $('create').textContent = 'Create'
  if ($('new-chat').checked) {
    work('start_chat', {
      repo, branch, base, create,
      prompt: $('new-prompt').value.trim() || undefined,
      harness: $('new-harness').value.trim() || harness,
      model: $('new-model').value.trim() || undefined,
    }, `Starting a chat on ${branch}`)
  } else {
    work('create', { repo, branch, base }, `Creating ${branch}`)
  }
})

openremote.settings.get().then(({ values }) => {
  if (values.chat_harness) harness = values.chat_harness
  $('new-harness').placeholder = harness
}).catch(() => {})
openremote.settings.onChange(({ values }) => {
  harness = values.chat_harness || 'claude'
  $('new-harness').placeholder = harness
  load()
})
load()
</script>
</body>
</html>
