[package]
name = "worktrunk-plugin"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "OpenRemote's official Worktrunk plugin: git worktrees for agents, through the wt command-line tool"

[[bin]]
name = "worktrunk-plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

# Its own workspace: the plugin builds on its own, apart from the daemon.
[workspace]
