name: Client CI (Flutter Companion)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: clients/companion
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: clients/companion
        run: flutter analyze

      - name: Flutter Tests
        working-directory: clients/companion
        run: flutter test --reporter expanded

  build-web:
    name: Build Flutter Web (SPA)
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Build Web Release
        working-directory: clients/companion
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn --base-href /

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: clients/companion/build/web
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android Development APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Build APK & App Bundle
        working-directory: clients/companion
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            clients/companion/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows Release Binary
    needs: analyze-test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        working-directory: clients/companion
        run: |
          flutter pub get
          flutter build windows --release

      - name: Archive Windows Build
        shell: pwsh
        run: |
          $src = "clients/companion/build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "clients/companion/build/windows/runner/Release" }
          Compress-Archive -Path "$src/*" -DestinationPath "companion-windows-x64.zip" -Force
          Get-ChildItem companion-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows
          path: companion-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  embed-check:
    name: Verify Flutter Web Embeds into Go Binary
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build Daemon with Embedded Web
        env:
          CGO_ENABLED: 0
        run: |
          go run ./tools/build -web-dir web-dist -version ci-embed-check -output /tmp/openremote
          /tmp/openremote version
          go test -tags flutterweb ./internal/core/server
          echo "Embedded binary size: $(du -h /tmp/openremote | cut -f1)"
