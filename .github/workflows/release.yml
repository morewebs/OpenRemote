name: Release

# Bundles the Windows, macOS and Linux installers and the signed Android
# APK, and publishes them as a GitHub Release. A manual run (Actions >
# Release > Run workflow) builds everything the same way and publishes
# nothing: the installers land as the run's own downloadable files, the
# way to check a build (the macOS one included) before a tag.
#
# Nothing is published until every platform has succeeded. Each platform
# job builds and uploads its own artifacts to the run; the `publish` job
# runs only after all four and is the only step that touches a release.
# A failing platform therefore leaves no new release behind - on a tag,
# `releases/latest` does not move; on the nightly, the previous night's
# complete build stays in place rather than being replaced by a partial
# one. The desktop jobs stage the daemon sidecar first -
# src-tauri/binaries/ is gitignored, `npm run daemon` regenerates it -
# then tauri build produces the msi, nsis and Linux bundles. The desktop
# bundles are unsigned on purpose; the release notes say so. The Android
# APK is signed with the release key held as repo secrets, and the job
# fails unless the signature verifies. The tag preflight (versions, notes,
# the Android versionCode floor, the tag on the default branch) still runs
# first, in the Windows job, before any toolchain is fetched.
#
# Two channels share this one pipeline:
#
# - Stable: a `v*` tag. Its release is the newest release, so
#   `releases/latest/download/<name>` follows it. The desktop app looks
#   there once a day for `latest.json` (the endpoint in tauri.conf.json)
#   and offers a newer version, installed only on the user's click.
# - Nightly: the scheduled run. It builds whatever is on the default
#   branch and replaces the rolling `nightly` release, which is marked
#   prerelease on purpose - a nightly must never become `latest`, or the
#   stable download URLs would move to a test build. The publish job
#   deletes and recreates it once every platform has built, so its
#   download URLs stay fixed
#   (.../releases/download/nightly/OpenRemote-Setup-x64.exe) while the
#   binaries follow main. The previous nightly's commit is written into
#   the new notes, so the channel still reads as a history. A night that
#   fails leaves the previous night's release up, complete, rather than
#   serving a partial build; re-running its failed jobs publishes the new
#   one. Nothing in this path touches the stable channel.
#
# Every published release carries version-free names beside the versioned
# assets (OpenRemote-Setup-x64.exe, -x64.msi, -x86_64.AppImage,
# -amd64.deb, -universal.dmg, -universal.apk). A channel URL therefore
# never carries a version, and a version bump never edits a download link.
# The publish job refuses to finish a release that is missing any of the
# six, so a platform that silently changed its artifact name fails the run
# instead of shipping a page with a dead download link.
#
# In-app updates: with the updater signing key in the repository's secrets
# (TAURI_SIGNING_PRIVATE_KEY and its password; docs/releasing-updates.md),
# each desktop build also signs its update file, and each platform job stages
# the signature at the release root beside the version-free installer it
# signs (OpenRemote-Setup-x64.exe.sig, OpenRemote-x86_64.AppImage.sig, and
# the macOS app archive OpenRemote-universal.app.tar.gz with its .sig). The
# publish job writes latest.json from them for a stable tag and ships it in
# the same release, so `releases/latest/download/latest.json` always
# describes the release it sits in; there is no separate job. The key is
# only ever read from the secrets; without it the builds are exactly as
# before, nothing is signed, and no latest.json is written. The app verifies
# every update against the public key in tauri.conf.json.
#
# The Windows job also stages the portable pair the npm channel downloads
# (OpenRemote-windows-x64.exe, openremote-daemon-windows-x64.exe, and the
# SHA256SUMS-portable-windows-x64 they are verified against). Those three
# stay outside the six on purpose: the npm channel is a second front door
# to the app, so a release that lacks them still publishes, and the publish
# job names the gap instead of failing it.
#
# Supply chain: every action below is pinned to a full commit SHA with the
# release that SHA stands for in a trailing comment, and the Rust toolchain
# to a fixed version rather than `stable`. A tag build holds
# `contents: write` and the Android signing key, so neither a re-pointed
# action tag nor a fresh stable release may change what a release compiles
# or publishes. Artifacts move between jobs through `gh run download`
# rather than another action, so there is no extra pin to audit. Bump a
# pin deliberately: resolve the tag to its commit, then edit the SHA and
# its comment together. An annotated tag takes two requests, because the
# ref endpoint returns the tag object rather than a commit:
#   /repos/<owner>/<repo>/git/ref/tags/<tag>    -> object.sha, object.type
#   /repos/<owner>/<repo>/git/tags/<object.sha> -> object.sha (the commit)
# Swatinem/rust-cache ships annotated tags, so the second request is not
# hypothetical.

on:
  push:
    tags: ['v*']
  # The nightly channel. GitHub disables a schedule after 60 days without
  # repository activity, and a re-enabled one needs a manual run first;
  # re-running a past scheduled run republishes that night.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'a manual run builds and leaves the files on the run; only a tag or the schedule publishes'
        type: choice
        options: [build-only, nightly]
        default: build-only

permissions:
  # Read for every job, and the write the publisher needs granted on that
  # one job: a build has no reason to be able to write to the repository.
  contents: read

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        # bash, not the pwsh default: the artifact globs and the ${..#v}
        # trim below are bash-isms.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The preflight below compares this tag against the previous
          # v* tag's tauri.conf.json (the versionCode check), so the
          # job needs the tags and their history, not just this tag's
          # single commit.
          fetch-depth: 0
      # One name for the release everywhere below: the pushed tag, or
      # `nightly` for the nightly channel (a scheduled run has no tag -
      # GITHUB_REF_NAME would be the branch name). Publishing is decided
      # by the `publish` job's own condition: a manual run never reaches
      # it, and a tag or a night does once every platform has built.
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      # Fail fast on paperwork that does not add up, before any build
      # toolchain or dependency is fetched: the tag must equal the
      # version in every manifest that carries it (a mismatch ships
      # installers whose names disagree with the release title and the
      # notes), the notes file must exist (gh release create reads it
      # only after the full build), and the Android versionCode must
      # strictly exceed the previous release's - Android refuses an
      # update install otherwise, and the only way on is uninstalling
      # the app, which wipes its private data.
      #
      # This step runs for tags only. A nightly carries no version of its
      # own and its APK reuses the stable versionCode, so there is nothing
      # here to check for it: its notes are generated in the publish job
      # when the release is made. The notices file it ships is the same
      # one every build embeds, and the platform jobs fail on it if it is
      # missing (the Linux job hashes it, the bundle resources name it).
      - name: preflight (versions, notes, versionCode)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          export TAG="$GITHUB_REF_NAME"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";

            const tag = process.env.TAG;
            const ver = tag.replace(/^v/, "");
            const die = (msg) => {
              console.error(`preflight: ${msg}`);
              process.exit(1);
            };

            // The tag must equal every manifest that carries the version.
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const cargo = (/^version\s*=\s*"([^"]+)"/m.exec(
              readFileSync("src-tauri/Cargo.toml", "utf8"),
            ) || [])[1];
            if (pkg !== ver) die(`package.json says ${pkg}, the tag says ${ver}`);
            if (tauri.version !== ver) die(`src-tauri/tauri.conf.json says ${tauri.version}, the tag says ${ver}`);
            if (cargo !== ver) die(`src-tauri/Cargo.toml says ${cargo ?? "no version"}, the tag says ${ver}`);

            // The notes file gh release create reads must exist now,
            // not after a half hour of building.
            try {
              readFileSync(`release-notes/${tag}.md`, "utf8");
            } catch {
              die(`release-notes/${tag}.md is missing`);
            }

            // The notices ride with every artifact - the bundles read
            // them from bundle.resources, the daemon embeds them, and
            // the release lists the file itself.
            try {
              readFileSync("THIRD-PARTY_NOTICES.md", "utf8");
            } catch {
              die("THIRD-PARTY_NOTICES.md is missing");
            }

            // The Android versionCode must strictly exceed the
            // versionCode of the previous v* tag; an equal code
            // makes Android refuse the update install. A previous tag
            // that predates the Android bundle (no tauri.conf.json, or
            // no versionCode) sets no floor to exceed. Note: keep this
            // script free of single quotes - it rides inside a
            // single-quoted node -e argument.
            const code = tauri?.bundle?.android?.versionCode;
            if (code === undefined) {
              die("src-tauri/tauri.conf.json has no bundle.android.versionCode");
            }
            // The tag immediately before this one in version order;
            // for a first release there is no floor to exceed.
            const sorted = execFileSync(
              "git", ["tag", "--list", "v*", "--sort=v:refname"],
              { encoding: "utf8" },
            ).split("\n").filter((t) => t);
            const idx = sorted.indexOf(tag);
            if (idx > 0) {
              const prev = sorted[idx - 1];
              let prevCode;
              try {
                const prevConf = JSON.parse(execFileSync(
                  "git", ["show", `${prev}:src-tauri/tauri.conf.json`],
                  { encoding: "utf8" },
                ));
                prevCode = prevConf?.bundle?.android?.versionCode;
              } catch {
                // The previous tag predates the config; no floor.
              }
              if (prevCode !== undefined && !(code > prevCode)) {
                die(`Android versionCode ${code} does not exceed ${prevCode} (previous tag ${prev}); Android would refuse the update install`);
              }
            }
            console.log(`preflight: ${tag} agrees with the manifests, release-notes/${tag}.md and THIRD-PARTY_NOTICES.md exist, Android versionCode ${code} is good`);
          '
      # A tag can point at a commit no branch contains: a local commit, or
      # work on a branch that was never merged. Publishing from one would
      # ship installers built from code the project never accepted, move
      # `releases/latest` for every user, and do it through the pipeline
      # that holds the release token and the Android signing key. The
      # compare API answers whether this commit is on the
      # default branch's history: identical or behind is fine (a
      # maintenance tag on an older commit), ahead or diverged is not.
      - name: preflight (the tag is on the default branch)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          default="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${default}...${sha}" --jq .status)"
          case "$status" in
            identical|behind)
              echo "preflight: ${GITHUB_REF_NAME} is on ${default} (compare status: ${status})"
              ;;
            *)
              echo "preflight: ${GITHUB_REF_NAME} points at ${sha}, which is not on ${default} (compare status: ${status}); merge it into ${default} and tag that commit instead" >&2
              exit 1
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
      # Fixed at 1.99.1 rather than `stable` (every job here, and ci.yml,
      # does the same): a moving stable would let a re-pushed tag compile
      # with a different rustc than the build it replaces, and with it a
      # differently linked glibc-pinned daemon asset. 1.99.1 is the stable
      # the workspace is built and tested with today, and it sits above the
      # daemon's declared MSRV of 1.85 (the MSRV job in ci.yml checks that
      # floor separately).
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # Nothing is published before the publish job, so a tag that already
      # has a release can only be one this version built earlier: every
      # platform skips its build when the release already carries that
      # platform's asset, and the publish job then finds it complete and
      # does nothing. The gate matches the exact asset names this tag's
      # version implies, not an asset count: any other mix runs the build,
      # so a re-pushed tag never leaves a release missing the msi or the
      # nsis. The nightly always builds: last night's release is still up
      # (the publish job replaces it only after every platform succeeds),
      # so the gate must not mistake it for this night's.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch' && steps.ch.outputs.tag != 'nightly'
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if [ -n "$assets" ] \
            && grep -qxF "OpenRemote_${ver}_x64_en-US.msi" <<< "$assets" \
            && grep -qxF "OpenRemote_${ver}_x64-setup.exe" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      # The console's own tests, before half an hour of building. A tag can
      # be pushed straight at the default branch without that commit ever
      # going through a pull request, so this is the only place the suite
      # runs on exactly what is being shipped.
      - run: npm test
        if: steps.build.outputs.skip != '1'
      - run: OR_RELEASE=1 node scripts/sync-daemon.mjs
        if: steps.build.outputs.skip != '1'
      # With the updater signing key in the secrets, the build also signs the
      # installers for in-app updates (a .sig beside each); without it, the
      # build is exactly as before. The key is read from the secrets only, and
      # never on a manual run: workflow_dispatch can build any branch, and a
      # signed build of unreviewed code is an update the app would accept. A
      # build that had the key and made no signature fails here, rather than
      # shipping a release the app cannot update to.
      - name: tauri build
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && ! compgen -G 'src-tauri/target/release/bundle/nsis/*.exe.sig' > /dev/null; then
            echo "::error::the signing key was set but the build made no update signature (src-tauri/target/release/bundle/nsis/*.exe.sig)"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      # Tauri embeds the version in the artifact names
      # (OpenRemote_0.1.0_x64_en-US.msi, OpenRemote_0.1.0_x64-setup.exe),
      # so the globs stay version-proof. Each bundle is staged twice: under
      # its versioned name and under the channel's version-free one, so
      # `/releases/latest/download/OpenRemote-Setup-x64.exe` (stable) and
      # `/releases/download/nightly/OpenRemote-Setup-x64.exe` (nightly)
      # never change with a version bump. They ride to the publish job as
      # this run's artifacts, and only that job creates a release.
      - name: stage the Windows installers
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          cp src-tauri/target/release/bundle/nsis/*.exe OpenRemote-Setup-x64.exe
          cp src-tauri/target/release/bundle/msi/*.msi OpenRemote-Setup-x64.msi
          # The update's signature, at the release root beside the installer
          # it signs (the copy is byte for byte, so the signature holds).
          shopt -s nullglob
          sigs=(src-tauri/target/release/bundle/nsis/*.exe.sig)
          if [ "${#sigs[@]}" -gt 0 ]; then
            cp "${sigs[0]}" OpenRemote-Setup-x64.exe.sig
          fi
      # The portable pair that `npm install -g morewebs/OpenRemote` downloads:
      # the same two binaries the installer carries, staged under version-free
      # names so the launcher never has to know a version.
      #
      # A missing pair warns and carries on. The npm channel is a second front
      # door to the app, and it must never be the reason a tag's installers
      # fail to ship; when it does warn, this release simply has no npm entry,
      # and the publish job warns again rather than leaving a dead link.
      - name: stage the portable pair
        if: steps.build.outputs.skip != '1'
        run: |
          set -uo pipefail
          app=src-tauri/target/release/openremote-ui-desktop.exe
          daemon=src-tauri/target/release/openremote-daemon.exe
          if [ -f "$app" ] && [ -f "$daemon" ] \
            && cp "$app" OpenRemote-windows-x64.exe \
            && cp "$daemon" openremote-daemon-windows-x64.exe \
            && sha256sum OpenRemote-windows-x64.exe openremote-daemon-windows-x64.exe \
                 > SHA256SUMS-portable-windows-x64; then
            cat SHA256SUMS-portable-windows-x64
          else
            # No -e above on purpose: a disk-full runner or a renamed build
            # output must cost this release its npm entry, not its installers.
            echo "::warning::the portable pair could not be staged, so this release has no npm entry"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.skip != '1'
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            OpenRemote-Setup-x64.msi
            OpenRemote-Setup-x64.exe
            OpenRemote-Setup-x64.exe.sig
            OpenRemote-windows-x64.exe
            openremote-daemon-windows-x64.exe
            SHA256SUMS-portable-windows-x64

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # Tauri's Linux build dependencies (webkit2gtk 4.1 era).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The machine installer downloads a standalone daemon from the
      # release (openremote-daemon-linux-x86_64, checked against
      # SHA256SUMS). A plain runner build links a glibc newer than old
      # servers have, so the asset is cross-built pinned to glibc 2.28 -
      # the floor the daemon deploys are built to.
      - name: zig for the glibc-pinned daemon
        run: |
          set -euo pipefail
          ZIG=0.14.1
          # ziglang.org's download index publishes this checksum for
          # zig-x86_64-linux-0.14.1.tar.xz; verified against the index
          # at https://ziglang.org/download/index.json. A wrong or
          # tampered tarball must fail here, not inside a build.
          ZIG_SHA256=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum --check --strict -
          tar -xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG}" >> "$GITHUB_PATH"
          # Pinned so a new cargo-zigbuild release cannot change what a
          # tag build links against; bump deliberately, not by drift.
          cargo install --locked cargo-zigbuild --version 0.23.4
      - run: npm ci
      - run: OR_RELEASE=1 node scripts/sync-daemon.mjs
      # The config's bundle targets are the Windows formats; the CLI
      # flag picks the Linux ones for this runner.
      - name: tauri build
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles appimage,deb
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && ! compgen -G 'src-tauri/target/release/bundle/appimage/*.AppImage.sig' > /dev/null; then
            echo "::error::the signing key was set but the build made no update signature (src-tauri/target/release/bundle/appimage/*.AppImage.sig)"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      # The version-free names ride beside the versioned ones, the way
      # the Windows job stages them.
      - name: stage the Linux installers
        run: |
          set -euo pipefail
          cp src-tauri/target/release/bundle/appimage/*.AppImage OpenRemote-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb OpenRemote-amd64.deb
          # The AppImage is the Linux update; its signature, when the build
          # had the key, goes to the release root beside it.
          shopt -s nullglob
          sigs=(src-tauri/target/release/bundle/appimage/*.AppImage.sig)
          if [ "${#sigs[@]}" -gt 0 ]; then
            cp "${sigs[0]}" OpenRemote-x86_64.AppImage.sig
          fi
      # The machine installer's download: the daemon alone, named as
      # install.sh expects, with the checksum file it verifies against.
      #
      # `cargo zigbuild --target x86_64-unknown-linux-gnu.2.28` writes its
      # output to the *unsuffixed* target directory, the same one the
      # native sidecar build above wrote: the glibc suffix lives in the
      # linker configuration, not in the path. This step therefore runs
      # after `sync-daemon.mjs`, so the copy below is the pinned build of
      # the code this run just built, not the native one.
      #
      # The notices ride beside the binary - the daemon also embeds them,
      # but the release page and a plain download carry the readable file.
      - name: the daemon asset
        run: |
          set -euo pipefail
          ( cd daemon && cargo zigbuild -p openremote-daemon --locked --release --target x86_64-unknown-linux-gnu.2.28 )
          cp daemon/target/x86_64-unknown-linux-gnu/release/openremote-daemon openremote-daemon-linux-x86_64
          sha256sum openremote-daemon-linux-x86_64 THIRD-PARTY_NOTICES.md > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            OpenRemote-x86_64.AppImage
            OpenRemote-x86_64.AppImage.sig
            OpenRemote-amd64.deb
            openremote-daemon-linux-x86_64
            THIRD-PARTY_NOTICES.md
            SHA256SUMS

  android:
    # The phone. The daemon rides inside the APK as a library, so the
    # sidecar staging the desktop jobs do is not needed - but tauri's
    # config still lists the sidecar and the CLI resolves it, so stage
    # one anyway. Gradle drives cargo back through the tauri CLI once
    # per ABI; the default is all four, into one universal APK.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      # Gradle 9 / AGP 9 want JDK 17 at least; 21 is the LTS in play.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # The runner image ships the SDK with the 37.0 platform (the
      # minor-version scheme - there is no bare android-37 package) and
      # build-tools preinstalled; setup-android's own update pass dies
      # on Google's retirement of the legacy 'tools' package, so the SDK
      # is used as it ships. Licenses are accepted so AGP can fetch
      # anything the image lacks, and the 37.0 install is a no-op when
      # the platform is already there. The tauri CLI locates the NDK
      # through NDK_HOME (cargo-mobile2's contract, the same one
      # scripts/android-env.sh uses), and AGP finds the SDK through
      # local.properties.
      - name: point the build at the SDK and its NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          # yes feeds every license prompt, then dies on SIGPIPE; its
          # exit must not fail the step - only sdkmanager's own rc.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37.0"
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)"
          test -n "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties
      # A re-pushed tag whose release already carries THIS version's APK
      # skips the rebuild - the same gate the other jobs use. The gate
      # matches the exact name this tag's version implies (the staging
      # step below names the file the same way), not just any APK - a
      # re-pushed tag must not keep a previous commit's build. The nightly
      # always builds, for the same reason the Windows job does.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch' && steps.ch.outputs.tag != 'nightly'
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF "OpenRemote_${TAG#v}_universal.apk" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      - run: node scripts/sync-daemon.mjs
        if: steps.build.outputs.skip != '1'
      # keystore.properties names the key for the gradle build
      # (gitignored); the store path is relative to the app module.
      - name: stage the release signing key
        if: steps.build.outputs.skip != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/openremote-release.keystore.p12
          printf 'storeFile=openremote-release.keystore.p12\npassword=%s\nkeyAlias=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" > src-tauri/gen/android/keystore.properties
      - run: npx tauri android build --apk
        if: steps.build.outputs.skip != '1'
      # The signature is part of the release contract: the job fails if
      # the APK does not verify, and the log carries the signer cert.
      # AGP signs in the assemble when the release signing config is
      # wired; the -unsigned sibling is the intermediate.
      - name: verify the signature and stage the APK
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name 'app-universal-*.apk' ! -name '*unsigned*' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          test -n "$APK"
          echo "APK: $APK"
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -n 12
          cp "$APK" "OpenRemote_${TAG#v}_universal.apk"
          cp "$APK" OpenRemote-universal.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.skip != '1'
        with:
          name: android-apk
          path: |
            OpenRemote_*_universal.apk
            OpenRemote-universal.apk

  macos:
    # One universal .dmg for Apple silicon and Intel. The daemon is built
    # for both and merged with lipo into the universal sidecar tauri
    # expects. The app is ad-hoc signed - there is no Apple developer
    # account - so the release notes carry the first-open steps. With no
    # Mac to click through it, the bundle check is the proof: the job
    # fails unless the app and its sidecar carry both architectures and
    # the ad-hoc signature verifies.
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            daemon
            src-tauri
      # A re-pushed tag whose release already carries this version's dmg
      # skips the rebuild - the same gate the other jobs use. The nightly
      # never skips.
      - name: a rebuild, or a re-run
        id: build
        if: github.event_name != 'workflow_dispatch' && steps.ch.outputs.tag != 'nightly'
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF "OpenRemote_${TAG#v}_universal.dmg" <<< "$assets"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.build.outputs.skip != '1'
      - name: the universal daemon sidecar
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          ( cd daemon \
            && cargo build -p openremote-daemon --locked --release --target aarch64-apple-darwin \
            && cargo build -p openremote-daemon --locked --release --target x86_64-apple-darwin )
          mkdir -p src-tauri/binaries
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "daemon/target/$t/release/openremote-daemon" "src-tauri/binaries/openremote-daemon-$t"
          done
          lipo -create -output src-tauri/binaries/openremote-daemon-universal-apple-darwin \
            src-tauri/binaries/openremote-daemon-aarch64-apple-darwin \
            src-tauri/binaries/openremote-daemon-x86_64-apple-darwin
          lipo -info src-tauri/binaries/openremote-daemon-universal-apple-darwin
      # The .app as its own bundle too, not only inside the dmg: the check
      # below inspects it.
      - name: tauri build
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --target universal-apple-darwin --bundles app,dmg
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && ! compgen -G 'src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig' > /dev/null; then
            echo "::error::the signing key was set but the build made no update signature (src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - name: check the bundle
        if: steps.build.outputs.skip != '1'
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          ls -la "$BUNDLE" "$BUNDLE"/* || true
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$APP"
          test -n "$DMG"
          for bin in "$APP"/Contents/MacOS/*; do
            info="$(lipo -info "$bin")"
            echo "$info"
            grep -q x86_64 <<< "$info"
            grep -q arm64 <<< "$info"
          done
          codesign -dv "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt
          codesign --verify --deep --strict "$APP"
          ls -la "$DMG"
          cp "$DMG" OpenRemote-universal.dmg
          # The macOS update is the app archive, signed when the build had the
          # key: both go to the release root under the version-free name.
          ARCHIVE="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n 1)"
          if [ -n "$ARCHIVE" ] && [ -f "$ARCHIVE.sig" ]; then
            cp "$ARCHIVE" OpenRemote-universal.app.tar.gz
            cp "$ARCHIVE.sig" OpenRemote-universal.app.tar.gz.sig
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.skip != '1'
        with:
          name: macos-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            OpenRemote-universal.dmg
            OpenRemote-universal.app.tar.gz
            OpenRemote-universal.app.tar.gz.sig

  # The only job that touches a release. It runs after every platform has
  # succeeded, so a failure anywhere above leaves no new release behind: a
  # stable tag does not move `releases/latest`, and a nightly keeps last
  # night's complete release instead of replacing it with a partial one.
  # A manual run never reaches it (build-only). Re-running the failed
  # platform in the same run finishes the release, because the successful
  # platforms' artifacts are still on that run.
  publish:
    needs: [release, linux, android, macos]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # `actions: read` is what lets `gh run download` pull this run's own
    # artifacts; this is the only job that needs to write to the repository, so
    # the write is granted here and the workflow default stays read.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The notes file, and for the nightly the previous nightly tag's
          # commit for the "since" section.
          fetch-depth: 0
      - name: channel
        id: ch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.channel }}" = "nightly" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: fetch this run's artifacts
        run: |
          set -euo pipefail
          mkdir -p assets
          for name in windows-installers linux-installers android-apk macos-dmg; do
            # A re-pushed tag whose release is already complete skips every
            # platform build, so a missing artifact is not a failure here;
            # the completeness check below is what decides.
            gh run download "$GITHUB_RUN_ID" -n "$name" -D assets || echo "no $name artifact from this run"
          done
          ls -la assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: nightly notes
        if: steps.ch.outputs.tag == 'nightly'
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          {
            echo "# OpenRemote nightly - $(date -u +%Y-%m-%d)"
            echo
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${SHA}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "This is the automated nightly channel: unsigned test builds, replaced every night,"
            echo "at URLs that never change - \`https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/OpenRemote-Setup-x64.exe\`,"
            echo "and the same name for the msi, the AppImage, the deb, the dmg and the apk."
            echo "The stable channel is \`releases/latest\`. Nightlies report the stable version in-app"
            echo "(the build is not version-stamped yet) - this page's commit is the identity."
            echo
            if git rev-parse -q --verify "nightly^{commit}" > /dev/null; then
              PREVIOUS_NIGHTLY="$(git rev-parse --short "nightly^{commit}")"
              echo "## Since the last nightly (\`${PREVIOUS_NIGHTLY}\`)"
            else
              echo "## Recent commits"
            fi
            echo
            if [ -n "${PREVIOUS_NIGHTLY:-}" ] && git cat-file -e "${PREVIOUS_NIGHTLY}^{commit}" 2>/dev/null; then
              git log --oneline --no-decorate -n 60 "${PREVIOUS_NIGHTLY}..HEAD"
            else
              git log --oneline --no-decorate -n 25 HEAD
            fi
          } > nightly-notes.md
          cat nightly-notes.md
      - name: publish the release
        run: |
          set -euo pipefail
          NAMES=(
            OpenRemote-Setup-x64.exe
            OpenRemote-Setup-x64.msi
            OpenRemote-x86_64.AppImage
            OpenRemote-amd64.deb
            OpenRemote-universal.dmg
            OpenRemote-universal.apk
          )
          assets=()
          while IFS= read -r file; do
            assets+=("$file")
          done < <(find assets -maxdepth 1 -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.dmg' -o -name '*.apk' -o -name 'openremote-daemon-linux-x86_64' \
               -o -name 'THIRD-PARTY_NOTICES.md' -o -name 'SHA256SUMS' \
               -o -name 'SHA256SUMS-portable-windows-x64' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) | sort)
          have=()
          for file in "${assets[@]}"; do
            have+=("$(basename "$file")")
          done

          # What a release for this tag already carries, if one exists: a tag
          # release is only ever added to, so its names count toward the check
          # even when this run built nothing.
          existing=""
          if [ "$TAG" != "nightly" ] && gh release view "$TAG" > /dev/null 2>&1; then
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)"
          fi

          # A name that will be missing should stop the job while nothing is
          # published, not after: the release page is the first thing a
          # download link meets, so it may not go live incomplete.
          missing=()
          for name in "${NAMES[@]}"; do
            if printf '%s\n' "${have[@]}" | grep -qxF "$name"; then
              continue
            fi
            if [ -n "$existing" ] && grep -qxF "$name" <<< "$existing"; then
              continue
            fi
            missing+=("$name")
          done

          # A re-pushed tag whose release is already complete: every platform
          # skipped, so this run has no artifacts to add and the release is
          # left exactly as it is. A release left short by an interrupted
          # upload is the case this must not wave through: it fails here with
          # the names it lacks, instead of exiting 0 over a dead download link.
          if [ "${#assets[@]}" -eq 0 ] && [ "$TAG" != "nightly" ] && [ -n "$existing" ]; then
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "publish: ${TAG} already exists, no artifacts were built, and it is missing ${missing[*]}; nothing was published" >&2
              exit 1
            fi
            echo "publish: ${TAG} already has a complete release; nothing to publish"
            exit 0
          fi
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "publish: no artifacts were built in this run; refusing to publish an empty release" >&2
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "publish: nothing was published; this run and ${TAG} together lack ${missing[*]}" >&2
            exit 1
          fi

          # The npm channel's pair is deliberately outside NAMES: it is a
          # second door to the app, and a gap there must not hold back the
          # installers. It is named here so a release that ships without it
          # says so in the run, which is the only place anyone would look.
          for name in OpenRemote-windows-x64.exe openremote-daemon-windows-x64.exe \
                      SHA256SUMS-portable-windows-x64; do
            if printf '%s\n' "${have[@]}" | grep -qxF "$name"; then
              continue
            fi
            if [ -n "$existing" ] && grep -qxF "$name" <<< "$existing"; then
              continue
            fi
            echo "::warning::${TAG} has no ${name}, so the npm channel will not offer this release"
          done

          # The in-app updater's latest.json, for a stable version tag only
          # (vX.Y.Z): the app reads `releases/latest`, which neither a nightly
          # nor a pre-release may steer. It is
          # written from the signatures the platform jobs staged at the
          # release root (with any a partial release of this tag already
          # carries), for the installers this release really has, and it goes
          # out in the same create or upload as they do. A release built
          # without the signing key has no signatures and gets no latest.json.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mkdir -p sigs
            for name in OpenRemote-Setup-x64.exe OpenRemote-x86_64.AppImage \
                        OpenRemote-universal.app.tar.gz; do
              if [ -f "assets/${name}.sig" ] && [ -f "assets/${name}" ]; then
                cp "assets/${name}.sig" "sigs/${name}.sig"
              elif [ -n "$existing" ] && grep -qxF "${name}.sig" <<< "$existing" \
                   && grep -qxF "$name" <<< "$existing" \
                   && ! printf '%s\n' "${have[@]}" | grep -qxF "$name"; then
                gh release download "$TAG" --pattern "${name}.sig" --dir sigs
              fi
            done
            if compgen -G 'sigs/*.sig' > /dev/null; then
              node scripts/updater-manifest.mjs "$TAG" "$GITHUB_REPOSITORY" sigs > latest.json
              cat latest.json
              assets+=(latest.json)
            elif [ -n "$existing" ] && grep -qxF latest.json <<< "$existing"; then
              # A re-run without the key over a release that was signed: its
              # latest.json would describe installers this run is replacing.
              # Refused rather than repaired: nothing is deleted from a live
              # release by this job; re-run with the key in the secrets.
              echo "publish: ${TAG} already has latest.json but this run has no update signatures; nothing was published" >&2
              exit 1
            else
              echo "publish: no signed updates in ${TAG} (no signing key yet), so no latest.json"
            fi
          fi

          # A nightly replaces the rolling release only now, with every
          # platform built. Its tag moves to this run's commit.
          if [ "$TAG" = "nightly" ]; then
            if gh release view nightly > /dev/null 2>&1; then
              gh release delete nightly --yes --cleanup-tag
            fi
            gh release create nightly "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "OpenRemote nightly - $(date -u +%Y-%m-%d)" \
              --notes-file nightly-notes.md
          elif [ -n "$existing" ]; then
            # A re-pushed tag with a partial release: the platforms whose
            # asset was missing rebuilt, and their files join the release.
            # The check above has already proved the union is complete.
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$TAG" --clobber "${assets[@]}"
            fi
          else
            # The first publish for this tag: every channel name was just
            # found in this run, so the create cannot go live incomplete.
            gh release create "$TAG" "${assets[@]}" \
              --title "OpenRemote ${TAG#v}" \
              --notes-file "release-notes/${TAG}.md"
          fi
          echo "publish: ${TAG} is live"
        env:
          GH_TOKEN: ${{ github.token }}
