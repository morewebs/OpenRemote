name: Release & Export Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag or version to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-go:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag_name || github.ref }}

  build-flutter-web:
    name: Build Flutter Web (for embedding)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # For workflow_dispatch, check out the requested tag if it exists.
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Build Flutter Web
        working-directory: clients/companion
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn --base-href /

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: clients/companion/build/web
          if-no-files-found: error
          retention-days: 7

  build-go-binaries:
    name: Build Go Daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [build-flutter-web, verify-go]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: .zip
          - goos: windows
            goarch: arm64
            ext: .exe
            archive: .zip
          - goos: linux
            goarch: amd64
            ext: ""
            archive: .tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: .tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: .tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: .tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Resolve Version
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          RAW="$TAG_INPUT"
          [[ "$RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (raw: $RAW)"

      - name: Download Flutter Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Compile Binary
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUTPUT_NAME="openremote-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go run ./tools/build -web-dir web-dist -target-os "$TARGET_OS" -target-arch "$TARGET_ARCH" -version "$RELEASE_VERSION" -output "dist/$OUTPUT_NAME"
          ls -lh dist/

      - name: Package Archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          BIN="openremote-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ARCHIVE="openremote-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive }}"
          cd dist
          if [ "${{ matrix.archive }}" = ".zip" ]; then
            zip -9 "$ARCHIVE" "$BIN"
          else
            tar -czf "$ARCHIVE" "$BIN"
          fi
          # Keep both raw binary and archive; release will attach both.
          ls -lh
          # Remove raw binary if archiving already bundles it — keep both for flexibility.
          # (Comment out the next line to ship only archives.)
          # rm -f "$BIN"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK & Bundle
    needs: build-flutter-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Prepare Android signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openremote.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK & Bundle
        working-directory: clients/companion
        env:
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
          OPENREMOTE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          OPENREMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENREMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED_BUILD" = true ]; then export OPENREMOTE_KEYSTORE="$RUNNER_TEMP/openremote.jks"; fi
          flutter pub get
          flutter build apk --release
          mkdir -p build/distribution
          if [ "$SIGNED_BUILD" = true ]; then
            flutter build appbundle --release
            cp build/app/outputs/flutter-apk/app-release.apk build/distribution/openremote-android.apk
            cp build/app/outputs/bundle/release/app-release.aab build/distribution/openremote-android.aab
          else
            cp build/app/outputs/flutter-apk/app-release.apk build/distribution/openremote-android-preview.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: clients/companion/build/distribution/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-go-binaries, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Resolve Tag Name
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          [[ "$TAG_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid release tag"; exit 1; }
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          find . -type f \( -name "openremote-*" -o -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; | sort > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            release-assets/bin-*/*
            release-assets/android-release/*
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
