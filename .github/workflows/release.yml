name: Release

# Bundles the Windows installer and publishes it as a GitHub Release.
# Stages the daemon sidecar first - src-tauri/binaries/ is gitignored,
# `npm run daemon` regenerates it - then tauri build produces the msi and
# nsis bundles. Unsigned on purpose; the release notes say so.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        # bash, not the pwsh default: the artifact globs and the ${..#v}
        # trim below are bash-isms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon
            src-tauri
      - run: npm ci
      - run: OR_RELEASE=1 node scripts/sync-daemon.mjs
      - run: npx tauri build
      # Tauri embeds the version in the artifact names
      # (OpenRemote_0.1.0_x64_en-US.msi, OpenRemote_0.1.0_x64-setup.exe),
      # so the globs stay version-proof.
      - run: >
          gh release create "$GITHUB_REF_NAME"
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe
          --title "OpenRemote ${GITHUB_REF_NAME#v}"
          --notes-file "release-notes/${GITHUB_REF_NAME}.md"
        env:
          GH_TOKEN: ${{ github.token }}
