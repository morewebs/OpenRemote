name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here reads the repo and runs tests. Saying so explicitly means
# a retargeted or compromised action in this workflow cannot get a token
# that pushes to main, whatever the repository-wide default happens to be.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action here is pinned to a full commit SHA, with what it stands for
# in a trailing comment. Two lines name their pin differently, on purpose:
# the MSRV job pins the action itself and asks for its toolchain by input,
# so its comment records when the branch was resolved; and
# dtolnay/rust-toolchain publishes one branch per toolchain instead of
# tags, so `# 1.99.1` names the toolchain that branch's action.yml bakes in.
#
# Bump a pin deliberately: resolve the tag to its commit, then edit the SHA
# and its comment together. An annotated tag takes two requests, because
# the ref endpoint returns the tag object rather than a commit:
#   /repos/<owner>/<repo>/git/ref/tags/<tag>    -> object.sha, object.type
#   /repos/<owner>/<repo>/git/tags/<object.sha> -> object.sha (the commit)
# Swatinem/rust-cache ships annotated tags, so the second request is not
# hypothetical.
#
# The Rust toolchain here is fixed at 1.99.1 (the same version release.yml
# pins) rather than following `stable`, so CI tests the compiler a release
# is built with even months later.

jobs:
  console:
    name: console (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # The capability scope is what keeps the app's own commands, and the
      # daemon token behind `daemon_info`, out of the browser's tabs. It is
      # one JSON line, so it is asserted rather than trusted to review.
      # Once is enough: the assertion reads a file in the repo.
      - name: the console's capability scope
        if: runner.os == 'Linux'
        run: node scripts/check-tab-acl.mjs
      # The assertion above passes on the tree as it is; this proves it can
      # still fail, against a copy, so a rewrite that quietly stops judging
      # anything goes red here instead of printing ok forever.
      - name: the acl check can still fail
        if: runner.os == 'Linux'
        run: node scripts/check-tab-acl.mjs --self-test
      - run: npm run build

  daemon:
    name: daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A toolchain-named ref installs the default profile only: without the
      # components named here, `cargo fmt` answers "'cargo-fmt' is not
      # installed for the toolchain" and the gate below never reaches the
      # code it is meant to judge. rustfmt for the format check, clippy for
      # the lint step behind it. The wasm32-unknown-unknown target is for the
      # text-tools example plugin, which e2e_plugin_examples builds and runs
      # as WASM; without it that test prints "skipped:" and passes.
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      # The Rust gates run in a fixed order and stop at the first failure:
      # the format check, then the lints, then the tests.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The e2e suite locates the fixture agent in target/debug; build it
      # up front so its tests never spawn a nested cargo build under the
      # target-dir lock. Two suites still build their own helpers once per
      # test process: the plugin e2e runs `cargo build -p fixture-driver`
      # (fresh after the workspace build, so quick), and
      # e2e_plugin_examples builds examples/plugins' own crates into
      # target/examples (their own target dir and lock) after a
      # `cargo fetch`; with no network and no local copy of their crates
      # those tests print "skipped:" and pass. The text-tools one needs the
      # wasm32-unknown-unknown target, which this job installs above.
      - run: cargo build -p fixture-agent --locked
      - run: cargo test --locked

  # The SSH example plugin is its own crate (examples/plugins/ssh/program,
  # its own workspace and lock), and its tests are what pin its security
  # rules: host keys always checked, no ssh option from a setting, no key
  # kept, ssh's environment and the time limits. It gets a job of its own so
  # a failure in the daemon job's format or lint steps cannot hide whether
  # these pass. The tests run first; its own format and lint checks come
  # after them.
  ssh-plugin:
    name: ssh plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/plugins/ssh/program
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/plugins/ssh/program
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The shell crate (src-tauri) reaches a release tag today without ever
  # being compiled or linted: the console job tests the web app and the
  # daemon job the daemon workspace, so a broken desktop.rs stays green
  # on main and is first discovered on the release runner. Check and lint
  # the shell here so it fails in the PR instead. No daemon build and no
  # npm here: the console dist and the sidecar are release-time concerns.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The shell crate links GTK/WebKit on Linux; the runner image
      # ships none of the dev headers (the same set the release build
      # installs). macOS and Windows need nothing here.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The staged sidecar under src-tauri/binaries is gitignored, but the
      # tauri build script still wants its externalBin path to exist
      # before it compiles anything. A placeholder file is enough: check
      # and clippy never execute the sidecar, and bundling swaps in the
      # real daemon binary from the release pipeline.
      - run: |
          triple="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          exe=""
          case "$triple" in *windows-msvc) exe=".exe" ;; esac
          mkdir -p binaries
          touch "binaries/openremote-daemon-$triple$exe"
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo check --locked
      # Clippy compiles the tests but runs none, and until now nothing did:
      # the three tests in browser/mod.rs pin what a page in a tab may load
      # (app-local addresses and the user's own dev servers only), and a
      # relaxed guard shipped in the last release because the only proof
      # was a manual debug-build selftest. They need no window and no
      # sidecar beyond the placeholder above.
      #
      # What a green check here means is those three tests passed, and
      # nothing wider. The daemon workspace is the daemon job's business.
      # The Rust gates run in a fixed order and stop at the first failure:
      # format check, lints, check, then these tests. cargo fmt --all also
      # formats this crate's path dependencies under ../daemon, so a format
      # slip there fails this job too. The shell's tests live here rather
      # than in the daemon job so a lint elsewhere cannot hide whether the
      # navigation guard still holds.
      - run: cargo test --locked

  # The declared MSRV must hold against the real lockfile: transitive deps
  # can silently raise the floor (the yoke 0.8.3 lesson).
  msrv:
    name: daemon MSRV (1.85)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This job asks the action for a toolchain by name instead of using a
      # toolchain-named ref, so the pin is the action itself and the input
      # stays the workspace's declared floor. `1.85` means the newest 1.85.x
      # rustup offers, which is where the action's own 1.85 ref points too.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-26
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: daemon
      - run: cargo check --locked --all-targets
