[workspace]
# 3: new dependencies resolve to versions that build on rust-version.
resolver = "3"
members = [
    "crates/openremote-core",
    "crates/openremote-harness",
    "crates/openremote-claude",
    "crates/openremote-codex",
    "crates/openremote-grok",
    "crates/openremote-pi",
    "crates/openremote-opencode",
    "crates/openremote-agy",
    "crates/openremote-daemon",
    "crates/openremote-cloud",
    "crates/fake-cloud",
    "crates/fixture-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
