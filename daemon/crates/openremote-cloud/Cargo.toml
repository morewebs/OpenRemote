[package]
name = "openremote-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenRemote Cloud: moreweb sign-in, the device registry, and the end-to-end encrypted link between a user's devices"

[dependencies]
openremote-core = { path = "../openremote-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
uuid = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# ring rather than aws-lc: no cmake or NASM on Windows, and a static Linux
# build needs nothing but a C compiler.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
snow = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
webpki-roots = "1"

[lints]
workspace = true
