[package]
name = "openremote-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The OpenRemote daemon: harness supervisor, HTTP API, SSE event stream"

[lib]
name = "openremote_daemon"
path = "src/lib.rs"

[[bin]]
name = "openremote-daemon"
path = "src/main.rs"

[dependencies]
openremote-core = { path = "../openremote-core" }
openremote-harness = { path = "../openremote-harness" }
openremote-claude = { path = "../openremote-claude" }
openremote-codex = { path = "../openremote-codex" }
openremote-grok = { path = "../openremote-grok" }
openremote-pi = { path = "../openremote-pi" }
openremote-opencode = { path = "../openremote-opencode" }
openremote-agy = { path = "../openremote-agy" }
# local wall-clock time - the schedule engine fires at the machine's HH:MM
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
tower-http = { workspace = true }

[target.'cfg(unix)'.dependencies]
# setsid for installers: no controlling terminal to prompt into
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# the schedule e2e computes the machine's local HH:MM the same way the
# engine does
chrono = "0.4"

[lints]
workspace = true
