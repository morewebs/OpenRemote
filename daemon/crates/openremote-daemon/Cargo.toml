[package]
name = "openremote-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The OpenRemote daemon: harness supervisor, HTTP API, SSE event stream"

[lib]
name = "openremote_daemon"
path = "src/lib.rs"

[[bin]]
name = "openremote-daemon"
path = "src/main.rs"

[dependencies]
openremote-core = { path = "../openremote-core" }
openremote-harness = { path = "../openremote-harness" }
openremote-claude = { path = "../openremote-claude" }
openremote-codex = { path = "../openremote-codex" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
