[package]
name = "openremote-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The OpenRemote daemon: harness supervisor, HTTP API, SSE event stream"

[lib]
name = "openremote_daemon"
path = "src/lib.rs"

[[bin]]
name = "openremote-daemon"
path = "src/main.rs"

[dependencies]
openremote-core = { path = "../openremote-core" }
openremote-harness = { path = "../openremote-harness" }
openremote-claude = { path = "../openremote-claude" }
openremote-codex = { path = "../openremote-codex" }
openremote-grok = { path = "../openremote-grok" }
openremote-pi = { path = "../openremote-pi" }
openremote-opencode = { path = "../openremote-opencode" }
openremote-agy = { path = "../openremote-agy" }
openremote-cloud = { path = "../openremote-cloud" }
openremote-browser = { path = "../openremote-browser" }
# local wall-clock time - the schedule engine fires at the machine's HH:MM
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
tower-http = { workspace = true }
# serving a peer's request in-process through the router (ServiceExt::oneshot)
tower = { version = "0.5", features = ["util"] }
# plugins installed from an archive: .zip (deflate only) and .tar.gz
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
# marketplace entries: an archive's sha256 pin, an npm tarball's integrity
# (sha512, or the older sha1 shasum), and npm version ranges
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
semver = "1"

[target.'cfg(unix)'.dependencies]
# setsid for installers: no controlling terminal to prompt into
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The processes a daemon starts end with it (a job object), its pipes to
# the app stay its own, and the sidecar watches the app that started it.
# The version tokio already links, so nothing new ships.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# the moreweb stand-in the Cloud e2e suites sign in to
fake-cloud = { path = "../fake-cloud" }
# the frame-ceiling e2e speaks the relay's WebSocket directly, as a device
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# the schedule e2e computes the machine's local HH:MM the same way the
# engine does
chrono = "0.4"

[lints]
workspace = true
