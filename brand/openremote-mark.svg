<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024" role="img" aria-label="OpenRemote">
  <!-- OpenRemote's mark: five arcs and three dots, one colour each. This is the
       same geometry the console draws on launch (src/Splash.jsx), kept here so
       the mark exists as a file: an installable icon, a slide, a post.
       Transparent background; the strokes are round-capped so the arcs read as
       one broken ring. -->
  <title>OpenRemote</title>
  <g fill="none" stroke-width="24" stroke-linecap="round">
    <path d="M117.8 26.11A76 76 0 0 1 139.66 35.17" stroke="#FF5A2C"/>
    <path d="M164.83 60.34A76 76 0 0 1 173.89 82.2" stroke="#FFC324"/>
    <path d="M173.89 117.8A76 76 0 0 1 117.8 173.89" stroke="#4AD295"/>
    <path d="M82.2 173.89A76 76 0 0 1 60.34 164.83" stroke="#42C6FF"/>
    <path d="M35.17 139.66A76 76 0 0 1 26.11 117.8" stroke="#5983FC"/>
  </g>
  <g>
    <circle cx="26.85" cy="79.37" r="12" fill="#C65CE0"/>
    <circle cx="46.26" cy="46.26" r="12" fill="#5983FC"/>
    <circle cx="79.37" cy="26.85" r="12" fill="#42C6FF"/>
  </g>
</svg>
