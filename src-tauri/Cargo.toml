[package]
name = "openremote-ui-desktop"
version = "0.5.2"
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ~2.12: the built-in browser's tabs are child webviews, which Tauri ships
# behind its `unstable` feature; that API may change in a minor release,
# so the minor version only moves on purpose.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
# The built-in browser's messages with the daemon, and the page helper
# agents read pages through.
openremote-browser = { path = "../daemon/crates/openremote-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# tray-icon: OpenRemote can keep running in the tray when its window closes.
# (Keep panic = unwind: the Linux tray's appindicator guard catches a panic.)
# unstable: the built-in browser's tabs are child webviews of the window.
tauri = { version = "~2.12", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
# The update packages: a patch from one release's installer to the next, and
# the packed installer. The release tool uses the same codec (scripts/delta-tool).
zstd = "0.13"
# The browser module is desktop-only, and its pictures travel as data URLs on
# every desktop: a page's icon on Windows, and the file the console saves into
# Downloads everywhere. It lives here rather than under Windows because
# `browser_save_file` is not Windows-only, and a windows-only declaration is
# what kept the Linux and macOS builds from compiling after the browser landed.
base64 = "0.22"

# Updates: signed releases checked and installed from the app. Every download
# is verified against the public key in tauri.conf.json before it runs. The
# system's own TLS on Windows and macOS keeps the download client small; macOS
# updates arrive as a .app.tar.gz, so it also unpacks archives.
[target.'cfg(windows)'.dependencies.tauri-plugin-updater]
version = "2"
default-features = false
features = ["native-tls"]

[target.'cfg(target_os = "macos")'.dependencies.tauri-plugin-updater]
version = "2"
default-features = false
features = ["native-tls", "zip"]

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# The browser drives each tab's WebView2 directly (the DevTools protocol,
# browser keys, history): the same versions wry already links, so nothing
# new ships.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse"] }
# Ad and tracker blocking, off unless the user turns it on and picks a list:
# Brave's filter engine (MPL-2.0), with the public suffix list it needs to
# tell a site's own requests from others'. No list ships with the app.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# A second launch shows the running window instead of starting a second
# daemon on the same data.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
# The Android app runs the daemon in its own process (there are no
# sidecars on Android) and hears the sign-in's return address through
# its own URI scheme.
openremote-daemon = { path = "../daemon/crates/openremote-daemon" }
openremote-cloud = { path = "../daemon/crates/openremote-cloud" }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
android_system_properties = "0.1"
# sync: the phone browser's events are handed off its UI thread on a channel.
tokio = { version = "1", features = ["time", "sync"] }

[lib]
name = "openremote_ui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
